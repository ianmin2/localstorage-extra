name: lint and test

on:
    pull_request:
      branches:
        - main

jobs:
    pre_pull_request_checks:
      runs-on: ubuntu-latest  # Fast GitHub-hosted runner instead of self-hosted

      steps:
        - name: Checkout code
          uses: actions/checkout@v4  # Latest version

        - name: Set up Node.js
          uses: actions/setup-node@v4  # Latest version
          with:
            node-version: '18'
            cache: 'npm'  # Built-in npm caching

        - name: Install dependencies
          run: npm ci  # Faster than npm install

        - name: Run linting
          run: npm run lint

        - name: Run tests
          run: npm test